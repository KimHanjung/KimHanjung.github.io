<!doctype html>
<html lang="en" data-theme="dark">
<head>
{% include console/head.html %}
</head>
<body class="page-plain">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include console/topbar.html %}
  <main id="main" class="plain">
    {% include console/section-head.html id="page" index=page.index title=page.title %}

      <p>© {{ site.time | date: '%Y' }} {{ site.data.profile.name }}</p>
    </footer>
  </main>
</body>
</html>
