{%- assign profile = site.data.profile -%}
<header class="profile" id="about" aria-labelledby="name">
  <div class="profile-inner">
    <figure class="avatar">
      <img src="{{ profile.avatar | relative_url }}" alt="Portrait of {{ profile.name }}" width="480" height="480" decoding="async" fetchpriority="high">
      <span class="det" aria-hidden="true"><i></i><i></i><i></i><i></i><span class="det-tags"><b>person 0.98</b><b class="is-alt">robot 0.02</b></span></span>
    </figure>
    <h1 id="name" class="name">{{ profile.name }}</h1>
    <ul class="roles">
      {%- for r in profile.roles %}
      <li>{{ r.title }} <span class="at">@</span> <strong>{{ r.org }}</strong></li>
      {%- endfor %}
    </ul>
    <p class="loc"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.3" fill="currentColor"/></svg>{{ profile.location }}</p>
    <p class="tagline">{{ profile.tagline }}</p>
    <p class="status"><span class="pulse" aria-hidden="true"></span>{{ profile.status }}</p>
    <ul class="links" aria-label="Links">
      {%- for l in profile.links %}
      <li><a class="pill" href="{{ l.url }}"{% unless l.url contains 'mailto:' %} rel="noopener"{% endunless %}>{{ l.label }}</a></li>
      {%- endfor %}
      <li><a class="pill" href="{{ '/cv/' | relative_url }}">CV</a></li>
    </ul>
  </div>
</header>
